name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend install and test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload files with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete --exclude node_modules \
            -e "ssh -i ~/.ssh/id_deploy" \
            backend/ "$SSH_USER@$SSH_HOST:/var/www/ziboune/backend/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:/var/www/ziboune/frontend/dist/"

      - name: Install prod dependencies and restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd /var/www/ziboune/backend && npm ci --omit=dev && sudo systemctl restart ziboune"

      - name: Health check
        run: |
          sleep 5
          echo "Verification de https://ziboune.com/api/health"
          curl -fsS https://ziboune.com/api/health
          echo
          echo "Deploiement reussi"
