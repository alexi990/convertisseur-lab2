name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend install and test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files with rsync
        run: |
          SSH="ssh -i ~/.ssh/id_deploy"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          rsync -az --delete --exclude node_modules -e "$SSH" backend/ "$TARGET:/var/www/ziboune/backend/"
          rsync -az --delete -e "$SSH" frontend/dist/ "$TARGET:/var/www/ziboune/frontend/dist/"

      - name: Install prod dependencies and restart service
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /var/www/ziboune/backend && npm ci --omit=dev && sudo systemctl restart ziboune"

      - name: Health check
        run: |
          sleep 5
          curl -fsS https://ziboune.com/api/health
